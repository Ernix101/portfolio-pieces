{% extends "medications/base.html" %}

{% block content %}

<div class="confirm-delete">
    <h3>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m40-120 440-760 440 760H40Zm468.5-131.5Q520-263 520-280t-11.5-28.5Q497-320 480-320t-28.5 11.5Q440-297 440-280t11.5 28.5Q463-240 480-240t28.5-11.5ZM440-360h80v-200h-80v200Z"/></svg>
        Delete Patient
    </h3>
    <p>Are you sure you want to delete <strong>{{ patient.name }}</strong>?</p>
    <p>This action cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn-delete">Yes, Delete</button>
        <a href="{% url 'patient_detail' patient.pk %}" class="btn-cancel">Cancel</a>
    </form>
</div>

{% endblock content %}
