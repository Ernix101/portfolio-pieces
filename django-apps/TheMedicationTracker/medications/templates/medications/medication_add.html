{% extends "medications/base_full.html" %}
{% load static %}

{% block title %}Add Medication{% endblock %}
{% block content %}

<div class="form-page" style="background-image: url('{% static 'svgs/record-med.png' %}');">
    <div class="form-card">
        <h3>Add New Medication</h3>
        <p class="form-subtitle">Register a new Medication into the system</p>
        <form method="POST">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="form-actions">
                <a href="{% url 'inventory' %}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-save">Save Medication</button>
            </div>
        </form>
    </div>
</div>


{% endblock content %}
